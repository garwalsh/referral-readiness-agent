{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RRR Agent{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}">
</head>
<body>
{% block body %}
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="layout">
  <aside class="sidebar">
    <a class="identity" href="{% url 'run_agent' %}">
      <img class="identity-mark" src="{% static 'dashboard/favicon.svg' %}" width="34" height="34" alt="">
      <span class="identity-name">Referral <span>Readiness Agent</span></span>
    </a>
    <nav aria-label="Dashboard">
      <a href="{% url 'run_agent' %}"{% if active_page == 'run_agent' %} aria-current="page"{% endif %}>Run agent</a>
      <a href="{% url 'results' %}"{% if active_page == 'results' %} aria-current="page"{% endif %}>Run results</a>
      <a href="{% url 'history' %}"{% if active_page == 'history' %} aria-current="page"{% endif %}>Run history</a>
      <a href="{% url 'evaluations' %}"{% if active_page == 'evaluations' %} aria-current="page"{% endif %}>Evaluations</a>
    </nav>
    <form class="account" method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <span class="account-name">{{ request.user.get_username }}</span>
      <button type="submit">Sign out</button>
    </form>
  </aside>
  <main class="main" id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
</div>
{% endblock %}
</body>
</html>
